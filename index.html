<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Rakusupi</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <h1>らくらく 英語スピーチの元づくり</h1>

    <section class="block">
      <button id="recordBtn" class="btn primary">🎤 日本語を話す</button>
      <button id="stopRecordBtn" class="btn danger">⏹ 録音停止</button>
      <button id="saveBtn" class="btn secondary">💾 保存</button>
      <button id="loadBtn" class="btn secondary">📂 呼び出し</button>

      <div class="row">
        <div id="savedList" class="saved-list"></div>

        <button id="applySavedBtn" class="btn secondary">➡ ネイティブ欄に反映</button>
        <button id="newLessonBtn" class="btn danger">🆕 新しい学習</button>
      </div>

      <textarea id="jpText" rows="4"></textarea>
    </section>

    <section class="block">
      <button id="translateBtn" class="btn secondary">🔁 英語に翻訳</button>

      <!-- 中学3年レベル -->
      <div class="row">
        <label class="label">中学3年レベル（英検3級）</label>
        <input type="checkbox" id="chkJunior3"> 再生
      </div>
      <textarea id="enTextJunior3" rows="3"></textarea>
      <div id="explainJunior3" class="explain-box"></div>

      <!-- 高校レベル -->
      <div class="row">
        <label class="label">高校生レベル（英検2級）</label>
        <input type="checkbox" id="chkSenior"> 再生
      </div>
      <textarea id="enTextSenior" rows="3"></textarea>
      <div id="explainSenior" class="explain-box"></div>

      <!-- ネイティブレベル -->
      <div class="row">
        <label class="label">一般（ネイティブレベル）</label>
        <input type="checkbox" id="chkNative"> 再生
      </div>
      <textarea id="enTextNative" rows="3"></textarea>
      <div id="explainNative" class="explain-box"></div>

    </section>

    <section class="block">
      <button id="speakBtn" class="btn primary">🔊 英語を再生</button>
      <div class="slider-row">
        <label for="speedSlider" class="label-inline">再生スピード</label>
        <input type="range" id="speedSlider" min="60" max="150" value="100">
        <span id="speedValue">100%</span>
      </div>
    </section>

    <section class="block">
      <div id="status" class="status"></div>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
